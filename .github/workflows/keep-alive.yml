name: Keep-alive

on:
  schedule:
    # Runs every sunday at 3 a.m.
    - cron: '0 3 * * SUN'

jobs:
  call-test-workflow:
    permissions:
      contents: read
      id-token: write
    uses: openbraininstitute/BluePyOpt/.github/workflows/test.yml@master
  
  keep-workflow-alive:
    name: Keep workflow alive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Re-enables the scheduled workflow via the GitHub API instead of pushing
      # an empty commit to master (which is blocked by the branch ruleset).
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c  # v1