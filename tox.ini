[tox]
envlist =
    py3-unit-functional-style
    py314-unit-functional-style
minversion = 4

[gh-actions]
python =
    3.10: py3-unit-functional-style
    3.11: py3-unit-functional-style
    3.12: py3-unit-functional-style
    3.13: py3-unit-functional-style
    3.14: py314-unit-functional-style

[testenv]
envdir =
    py3{-unit,-functional,-style,-syntax}: {toxworkdir}/py3
    py314{-unit,-functional,-style,-syntax}: {toxworkdir}/py314
    docs: {toxworkdir}/docs
; arbor has no cp314 wheel and fails to build from source on recent
; toolchains (GCC 15), so the py3.14 env (py314, mapped in [gh-actions])
; drops arbor from the dependency set.
extras =
    py314: tests-no-arbor
    !py314: tests
deps =
    coverage
    flake8
    neuron-nightly
    sh
    pytest-cov
download = true
allowlist_externals =
    make
    find
    cd
    pwd
passenv = https_proxy
coverage_options = --cov-append --cov-report=xml --cov-config=.coveragerc
setenv = 
    ; for neuroml tests
    NEURON_HOME={envdir}
commands =
    make clean

    style: pycodestyle --ignore=E402,W503,W504 bluepyopt
    syntax: flake8 . --count --select=E9,F63,F72,F82 --show-source --statistics

    unit: pytest --cov=bluepyopt {[testenv]coverage_options} bluepyopt/tests -k unit
    functional: make stochkv_prepare l5pc_prepare sc_prepare meta_prepare
    functional: pytest --cov=bluepyopt {[testenv]coverage_options} bluepyopt/tests -k 'not unit and not neuroml'
    ; separate neuroml test from the other ones
    ; because it redefines l5pc template which makes neuron crash and tests fail
    functional: pytest --cov=bluepyopt {[testenv]coverage_options} bluepyopt/tests -m neuroml

[testenv:docs]
basepython = python3.12
changedir = docs
deps =
    sphinx>=8.2,<10
    obi-sphinx-theme>=2.0.0
    sphinx-autorun
commands = make html SPHINXOPTS=-W
allowlist_externals = make
